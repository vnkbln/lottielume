name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build and run CPU checks
        shell: pwsh
        run: ./scripts/build.ps1 -Tests CPU
      - name: Check embedded artwork
        shell: pwsh
        run: |
          .tools/Scripts/python.exe scripts/embed-demo.py --check
          .tools/Scripts/python.exe tests/thumbnails.py
          .tools/Scripts/python.exe scripts/validate-pack.py
      # Full WGL/OpenGL 4.1 tests need a local machine with a suitable GPU.
      # This workflow does not publish releases or upload binaries automatically.
